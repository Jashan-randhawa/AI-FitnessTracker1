name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  client:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Run client tests
        run: npm test

      - name: Run typecheck & build
        run: npm run build

  server:
    name: Server Syntax & Sanity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: |
          node -c server.js
          node -c src/app.js
          for file in src/config/*.js src/controllers/*.js src/middleware/*.js src/models/*.js src/routes/*.js src/services/*.js src/schemas/*.js src/utils/*.js; do
            node -c "$file"
          done

      - name: Test server module loading
        run: node -e "require('./src/app.js'); console.log('Server app modules resolved cleanly');"
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"
          CI: "true"
          CI_DRY_RUN: "true"

      - name: Run unit tests
        run: npm test
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"
          CI: "true"
          CI_DRY_RUN: "true"

      - name: Run server smoke test
        run: npm run test:smoke
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"
          CI: "true"
          CI_DRY_RUN: "true"
