name: CI

on:
  push:
    branches: [ main, packages ]
  pull_request:
    branches: [ main, packages ]

jobs:
  packages:
    name: Packages Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build:packages

      - name: Run all package tests
        run: npm run test:packages

  client:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build packages
        run: npm run build:packages

      - name: Run lint
        run: npm run lint --workspace=client

      - name: Install Linux native bindings for Tailwind v4
        run: npm install @tailwindcss/oxide-linux-x64-gnu@4.1.18 lightningcss-linux-x64-gnu@1.30.2 --no-save

      - name: Run typecheck & build
        run: npm run build:apps

  server:
    name: Server Syntax & Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build packages
        run: npm run build:packages

      - name: Check JavaScript syntax
        run: |
          cd apps/server
          node -c server.js
          node -c src/app.js
          node -c src/config/db.js
          for file in src/controllers/*.js src/middleware/*.js src/models/*.js src/routes/*.js src/services/*.js; do
            node -c "$file"
          done

      - name: Test server module loading
        run: |
          cd apps/server
          node -e "require('./src/app.js'); console.log('Server app modules resolved cleanly');"
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"

      - name: Run server unit tests
        run: npm run test:apps
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"
