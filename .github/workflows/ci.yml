name: CI

on:
  push:
    branches: [ main, packages ]
  pull_request:
    branches: [ main, packages ]

jobs:
  packages:
    name: Packages Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Run all package tests
        run: npm run test --workspaces --if-present

  client:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck & build
        run: npm run build

  server:
    name: Server Syntax & Sanity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node -c server.js
          node -c src/app.js
          node -c src/config/db.js
          for file in src/controllers/*.js src/middleware/*.js src/models/*.js src/routes/*.js src/services/*.js; do
            node -c "$file"
          done

      - name: Test server module loading
        run: node -e "require('./src/app.js'); console.log('Server app modules resolved cleanly');"
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"

      - name: Run unit tests
        run: npm test
        env:
          JWT_SECRET: "ci_test_secret_32_characters_long_min"
          NODE_ENV: "test"
